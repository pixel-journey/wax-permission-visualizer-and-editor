blueprint:
  id: wax-permission-visualizer-and-editor
  name: Account Permission Visualizer & Editor
  tier: 1
  category: security-foundational
  status: alpha-ready
  version: 1.1

metadata:
  description: |
    An elegant, interactive, safe visualizer + editor for Antelope/EOSIO-style 
    account permissions on WAX. Features hierarchical trees, multi-sig thresholds 
    (M-of-N), weight math, live previews, safety warnings, and WharfKit integration.
    All client-side with zero custom smart contracts required.
  target_audience:
    - Human developers and DAO operators managing permissions
    - AI agents generating secure permission tools
    - Teams building governance or key management systems on WAX/Antelope
  benchmark: gkniftyheads-tracker + Pixel Journey standards

features:
  core:
    - interactive_hierarchical_permission_tree
    - safe_multi_sig_threshold_simulation
    - live_account_fetching
    - editor_mode_with_local_persistence
    - strong_safety_warnings_and_risk_levels
  accessibility:
    - reduced_motion_support
    - keyboard_navigation
    - screen_reader_friendly
    - high_contrast_modes
  theming:
    - retro_pixel_glassmorphic_crt_aesthetic
  integration:
    - wharfkit_proposal_signing
    - embeddable_viewer_component
    - full_standalone_demo

integration_levels:
  minimal:
    description: Basic interactive viewer with simple safety warnings
    recommended_for: Learning and quick embedding
  recommended:
    description: Full visualizer + editor + live simulation with strong safety features
    recommended_for: Most production and DAO use cases
  advanced:
    description: Deep simulation, batch auditing, advanced analytics, and change diffing
    recommended_for: Enterprise or high-security governance tools

machine_instructions:
  - |
    Generate a full Next.js 15 + TypeScript strict scaffold with Zustand and TanStack Query.
  - |
    Implement a recursive SVG + Canvas permission tree with keyboard navigation and drag support.
  - |
    Create a pure client-side JavaScript threshold engine with 10+ safety rules and clear warnings.
  - |
    Build a live multi-sig simulation UI with risk level indicators and clear feedback.
  - |
    Add WharfKit session integration for proposing permission changes on-chain with previews.
  - |
    Include strong accessibility features: reduced motion, ARIA labels, keyboard navigation.
  - |
    Apply retro-pixel glassmorphic CRT aesthetic using custom CSS variables.
  - |
    Prioritize educational clarity and safety in all flows and messaging.

technical_requirements:
  framework: Next.js 15 (App Router) + TypeScript (strict)
  styling: Tailwind + shadcn/ui + custom pixel CSS
  state: Zustand + TanStack Query
  visualization: Custom recursive SVG + Canvas (dependency-free)
  simulation: Pure client-side JavaScript threshold engine
  blockchain: Native fetch + optional WharfKit

best_practices:
  - Always show clear safety warnings and previews before any permission change
  - Use visual trees to make complex permission structures understandable
  - Provide actionable feedback, not just errors
  - Support both viewer and editor modes with clear separation
  - Make simulation instant and free (client-side)
  - Handle edge cases (missing keys, impossible thresholds, dangerous relationships) gracefully

future_extensions:
  - On-chain permission change simulation with fee estimation
  - Batch permission auditing across multiple accounts
  - Hardware wallet integration patterns
  - Advanced visual diff for permission changes
  - Export permission structures as diagrams or reports
